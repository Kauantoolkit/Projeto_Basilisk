services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gym_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..              # Projeto_Basilisk (acesso a basilisk-libs-java)
      dockerfile: gym-manager/Dockerfile.backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/gym_manager
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: changeme-minimum-32-characters-long!!
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..              # Projeto_Basilisk (acesso a basilisk-libs)
      dockerfile: gym-manager/Dockerfile.frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata:
